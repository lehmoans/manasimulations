# AutoFluent case configuration
# This file defines WHAT the simulation does.
# Execution details belong in environment.yaml.

save_dir:
  path: null

geometry:
  file: "geom.scdC"

meshing:
  enabled: true
  show_gui: false
  file: "mesh.msh"

  boundaries:
    inlet:
      type: "velocity-inlet"
    outlet:
      type: "pressure-outlet"

  enclosure:
    enc1:
      name: "enc1"
      properties: null

  wall_groups:
    rot_grp:
      name: "rot_group"
    stat_grp:
      name: "stat_group"
    blade_group:
      name: "blades"

  local_sizing:
    facesize_blades:
      type: "Face Size"
      growth_rate: 1.15
      target_mesh_size: null
      face_label_list:
        - "blades"

  surface_mesh:
    growth_rate: 1.15
    max_size: null
    min_size: null
    size_functions: "Curvature"
    curvature_normal_angle: null
    cells_per_gap: 3
    scope_proximity_to: "edges"

  boundary_layer:
    type: "smooth-transition"
    number_of_layers: 4
    growth_rate: 0.9
    transition_ratio: 1.1

  face_quality_limit: 0.4
  cell_type: "poly-hexacore"

solver:
  gui:
    enabled: false

  time:
    time_step: 0.001
    iterations: 100

  models:
    viscous:
      model: "k-epsilon"
      formulation: "realizable"
      curvature_correction: true

  reference_values:
    area: 0.1
    density: 2000
    velocity: 0.1

  materials:
    fluid:
      name: "water"
      density: 2000
      zones: null
    solid:
      name: null
      density: null
      zones: null

  BC:
    inlet:
      name: "inlet"
      type: "velocity"
      value: 0.1
      area: 0.1
      turbulence_intensity: 0.5
      turbulence_viscosity_ratio: 0.5
    outlet:
      name: "outlet"
      type: "pressure"
      value: 0
      turbulence_intensity: 0.5

  initialization:
    type: "standard"

  solution:
    control:
      model: "p-v"

    methods:
      discretization:
        pressure: "second-order"
        k: "second-order-upwind"
        epsilon: "second-order-upwind"

    monitors:
      residuals:
        continuity: 0.0001
        x-velocity: 0.0001
        y-velocity: 0.0001
        z-velocity: 0.0001
        k: 0.0001
        epsilon: 0.0001
      reports:
        drag:
          parameter: "cd1"

    report_definitions:
      quantities:
        cd1:
          zones:
            - "blades"
            - "enc1"
          force_vector: [0, 0, 1]
      reports:
        drag:
          name: "drag"
          parameter: "cd1"

  run:
    iterations: 5

  save:
    enabled: true
    name: null

post_process:
  enabled: true

  iso_surfaces:
    x0:
      field: "x-coordinate"
      value: 0

  contours:
    velocity_mag:
      field: "velocity-magnitude"
      surfaces:
        - "x0"
      save_format: "png"

verbose:
  enabled: false
