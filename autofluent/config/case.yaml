# AutoFluent case configuration
#
# This file defines WHAT the simulation does.
# Execution details (local/M3/mock, Fluent installation, CPUs, memory) belong
# in environment.yaml.
#
# GUI convention:
# - a mapping is a configurable section;
# - an opened/selected section is enabled;
# - an unopened section is written as null;
# - an empty leaf value is null (use Fluent/default behaviour where supported).

# -----------------------------------------------------------------------------
# Project / output
# -----------------------------------------------------------------------------
save_dir:
  path: null

# -----------------------------------------------------------------------------
# Geometry
# -----------------------------------------------------------------------------
geometry:
  file: "geom.scdC"

# -----------------------------------------------------------------------------
# Meshing
# -----------------------------------------------------------------------------
meshing:
  show_gui: false
  enabled: true

  # Used when meshing is disabled.
  file: "mesh.msh"

  # Boundary names / groups created in SpaceClaim.
  boundaries:
    inlet: "inlet"
    outlet: "outlet"

  # Named enclosure definitions.
  enclosure:
    enc1:
      name: "enc1"
      properties: null

  # Named wall groups created in SpaceClaim.
  wall_groups:
    rot_grp:
      name: "rot_group"
    stat_grp:
      name: "stat_group"
    blade_group:
      name: "blades"

  # Named local sizing controls. Additional sizing definitions can be added
  # without changing the overall schema.
  local_sizing:
    facesize_blades:
      type: "Face Size"
      growth_rate: 1.15
      target_mesh_size: null
      face_label_list:
        - "blades"

  # Global surface-mesh controls.
  surface_mesh:
    growth_rate: 1.15
    max_size: null
    min_size: null
    size_functions: "Curvature"
    curvature_normal_angle: null
    cells_per_gap: 3
    scope_proximity_to: "edges"

  # Boundary-layer controls.
  boundary_layer:
    type: "smooth-transition"
    number_of_layers: 4
    growth_rate: 0.9
    transition_ratio: 1.1

  face_quality_limit: 0.4
  cell_type: "poly-hexacore"

# -----------------------------------------------------------------------------
# Solver
# -----------------------------------------------------------------------------
solver:
  # Solver GUI is independent of the AutoFluent configuration GUI.
  gui:
    enabled: false

  time:
    time_step: 0.001
    iterations: 100

  models:
    viscous:
      model: "k-epsilon"
      formulation: "realizable"
      curvature_correction: true

  reference_values:
    area: "${BC.inlet.area}"
    density: "${materials.fluid.density}"
    velocity: "${BC.inlet.velocity}"

  materials:
    fluid:
      name: "water"
      density: 2000
      zones: null
    solid:
      name: null
      density: null
      zones: null

  # Boundary-condition definitions.
  # Add further named boundaries under this mapping as the model grows.
  BC:
    inlet:
      type: "velocity"
      value: 0.1
      area: 0.1
      turbulence_intensity: 0.5
      turbulence_viscosity_ratio: 0.5
    outlet:
      type: "pressure"
      value: 0
      turbulence_intensity: 0.5

  initialization:
    type: "standard"

  solution:
    control:
      model: "p-v"

    methods:
      discretization:
        pressure: "second-order"
        k: "second-order"
        epsilon: "second-order"

    monitors:
      residuals:
        general: 0.0001
        continuity: "${monitors.residuals.general}"
        x-velocity: "${monitors.residuals.general}"
        y-velocity: "${monitors.residuals.general}"
        z-velocity: "${monitors.residuals.general}"
        k: "${monitors.residuals.general}"
        epsilon: "${monitors.residuals.general}"

      reports:
        drag:
          parameter: "${report_definitions.quantities.drag.name}"

  # Reusable report quantities and the reports generated from them.
  report_definitions:
    quantities:
      drag:
        name: "cd1"
        zones:
          - "blades"
          - "enc1"
        force_vector: [0, 0, 1]

    reports:
      drag:
        name: "drag"
        parameter: "${report_definitions.quantities.drag.name}"

  run:
    iterations: 5

  save:
    name: null

# -----------------------------------------------------------------------------
# Post-processing
# -----------------------------------------------------------------------------
post_process:
  enabled: true

  iso_surfaces:
    x0:
      field: "x-coordinate"
      value: 0

  contours:
    velocity_mag:
      field: "velocity-magnitude"
      surfaces:
        - "x0"
      save_format: "png"

# -----------------------------------------------------------------------------
# Optional case-level diagnostics
# -----------------------------------------------------------------------------
verbose:
  enabled: false
