[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autofluent"
version = "0.1.0"
description = "Config-driven automation framework for ANSYS Fluent simulations"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"